name: Validate Along
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m unittest discover -s build-tests -p 'test_*.py'
      - run: python -m unittest discover -s release-tools -p 'test_*.py'
      - run: python release-tools/validate_release.py plugins/along --fixtures fixtures
      - run: python build.py
